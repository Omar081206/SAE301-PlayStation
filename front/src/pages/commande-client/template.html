<!-- Même mise en page que l'accueil de l'espace personnel (pages/compte).
     Les messages (« Commander à nouveau ») se placent entre le statut et le
     détail, comme sur la maquette. -->
<div class="grid gap-5.25 px-7 py-7 lg:grid-cols-[15rem_minmax(0,1fr)] lg:gap-x-10 lg:gap-y-6 lg:px-20 lg:py-8">
  <h1 class="text-intertitre-sm font-light lg:col-start-2 lg:row-start-1 lg:text-produit-lg">{{titre}}</h1>

  <div class="lg:col-start-1 lg:row-span-2 lg:row-start-1">
    <slot name="navigation"></slot>
  </div>

  <div class="flex min-w-0 flex-col items-start gap-5.25 lg:col-start-2 lg:gap-6">
    <a href="/compte/commandes" data-link class="text-sm font-bold text-lien lg:text-base hover:text-lien-survol"><span aria-hidden="true">‹</span> Retour à mes commandes</a>
    <slot name="statut"></slot>
    <div class="flex w-full flex-col gap-3.5 *:mb-0 empty:hidden lg:gap-4"><slot name="message"></slot></div>
    <slot name="contenu"></slot>
  </div>
</div>
