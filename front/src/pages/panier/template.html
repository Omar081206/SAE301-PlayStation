<div class="px-7 py-7 lg:px-20 lg:py-8">
  <h1 class="mb-5.25 text-produit-sm font-light md:text-produit-md lg:mb-6 lg:text-produit-lg">{{titre}}</h1>

  <slot name="message"></slot>

  <div class="grid gap-5.25 lg:grid-cols-[1fr_25rem] lg:gap-12">
    <slot name="lignes"></slot>
    <slot name="resume"></slot>
  </div>

  <slot name="modale"></slot>

  <!-- Bulle « plus de stock » : en bas à gauche de l'écran, visible même après défilement. -->
  <div class="fixed right-3.5 bottom-3.5 left-3.5 z-30 md:right-auto md:max-w-sm *:mb-0 *:shadow-panneau">
    <slot name="notification"></slot>
  </div>
</div>
