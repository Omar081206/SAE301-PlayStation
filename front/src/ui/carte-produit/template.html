<article class="relative flex flex-col gap-2.5 rounded-md border-2 border-trait bg-page p-2.5 lg:gap-3 lg:rounded-lg lg:p-3">
  <div class="relative flex h-32.5 items-center justify-center overflow-hidden rounded-md bg-tuile md:h-45 lg:h-60 lg:rounded-lg">
    <img src="{{image}}" srcset="{{srcset}}" sizes="(min-width: 1024px) 220px, (min-width: 768px) 330px, 40vw" alt="{{alt}}" width="240" height="240" loading="lazy" decoding="async" class="size-full object-contain">
    <!-- Badge de stock, puis badge « −20 % » du produit en promotion (slot « promotion », retiré sinon). -->
    <p class="absolute top-2 left-2 flex gap-1"><slot name="badge"></slot><slot name="promotion"></slot></p>
  </div>

  <!-- Le lien couvre toute la carte (after:inset-0) : un clic n'importe où
       ouvre la fiche, sans enfermer dans le lien d'autres éléments cliquables. -->
  <h2 class="line-clamp-2 h-9 text-sm leading-4.5 lg:h-10.5 lg:leading-5.25">
    <a href="/produit/{{slug}}" data-link class="after:absolute after:inset-0">{{nom}}</a>
  </h2>

  <div class="flex min-h-8 items-center justify-between lg:min-h-10">
    <!-- Produit en promotion : le prix d'origine barré à côté (data-role « initial », retiré sinon). -->
    <div class="flex flex-wrap items-baseline gap-x-1.5">
      <p class="text-base leading-5.25 lg:leading-6">{{prix}}</p>
      <s data-role="initial" class="text-xs text-texte-barre lg:text-sm"><span class="sr-only">Prix d’origine : </span>{{prixInitial}}</s>
    </div>
    <!-- relative z-10 : le bouton passe au-dessus du lien qui couvre la carte. -->
    <button type="button" data-action="ajouter" aria-label="Ajouter {{nom}} au panier" class="anneau-action relative z-10 flex size-8 items-center justify-center rounded-full bg-action disabled:bg-trait lg:size-10 enabled:hover:bg-action-survol">
      <img src="{{iconeAjout}}" alt="" width="20" height="20" class="size-4 lg:size-5">
    </button>
  </div>
</article>
