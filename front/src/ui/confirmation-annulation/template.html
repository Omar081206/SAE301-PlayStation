<section class="flex flex-col gap-3.5 rounded-xl border-2 border-red-700 bg-page p-5.25 lg:max-w-200 lg:gap-4 lg:rounded-2xl lg:p-6">
  <h2 data-focus tabindex="-1" class="text-prix-sm font-light lg:text-prix-lg">{{titre}}</h2>

  <p class="text-sm">{{explication}}</p>

  <div class="flex flex-wrap gap-3.5">
    <button type="button" data-action="confirmer" class="rounded-full bg-red-700 px-4 py-3 text-sm leading-3.5 font-bold text-texte-inverse">Confirmer l’annulation</button>
    <button type="button" data-action="retour" class="rounded-full bg-secondaire px-4 py-3 text-sm leading-3.5 font-bold text-lien">Ne pas annuler</button>
  </div>
</section>
