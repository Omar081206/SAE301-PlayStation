<li class="flex items-start justify-between gap-4 text-sm leading-5.25">
  <div class="flex flex-col gap-0.5">
    <p class="font-bold">{{nom}}</p>
    <p class="text-texte-attenue">{{details}}</p>
  </div>
  <!-- Produit acheté en promotion : le montant d'origine barré au-dessus (data-role « initial », retiré sinon). -->
  <div class="shrink-0 text-right">
    <s data-role="initial" class="block text-xs font-normal text-texte-barre lg:text-sm"><span class="sr-only">Prix d’origine : </span>{{sousTotalInitial}}</s>
    <p>{{sousTotal}}</p>
  </div>
</li>
