<li class="flex flex-col gap-1.5 border-t border-trait p-2.5 text-sm first:border-t-0">
  <p>{{nom}}</p>
  <dl class="grid grid-cols-[1fr_auto] gap-x-4 gap-y-1.5 text-xs">
    <dt class="font-semibold">Options</dt><dd class="text-right text-sm">{{options}}</dd>
    <dt class="font-semibold">Qté</dt><dd class="text-right text-sm">{{quantite}}</dd>
    <dt class="font-semibold">Prix unitaire</dt><dd class="text-right text-sm">{{prixUnitaire}}</dd>
    <dt class="font-semibold">Total</dt><dd class="text-right text-sm">{{sousTotal}}</dd>
  </dl>
</li>
