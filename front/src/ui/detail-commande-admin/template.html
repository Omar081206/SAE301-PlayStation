<div class="flex flex-col gap-3.5 lg:gap-6">
  <!-- Mobile : titre, boutons, statut. À partir de lg : boutons à droite du
       titre, statut dessous. -->
  <div class="grid gap-2.5 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-start">
    <h1 class="text-intertitre-sm font-bold lg:col-start-1 lg:row-start-1 lg:text-intertitre-lg">Commande {{numero}}</h1>
    <div class="flex flex-wrap gap-2 lg:col-start-2 lg:row-start-1">
      <slot name="boutons"></slot>
    </div>
    <div class="lg:col-start-1 lg:row-start-2">
      <slot name="statut"></slot>
    </div>
  </div>

  <div class="grid gap-3.5 lg:grid-cols-[minmax(0,1fr)_17.25rem] lg:items-start lg:gap-4">
    <div class="flex flex-col gap-3.5 lg:gap-4">
      <section class="flex flex-col gap-3.5 rounded-xl border border-trait bg-page p-3.5 lg:gap-4 lg:p-6">
        <h2 class="text-prix-sm font-bold">Articles</h2>

        <!-- Tableau à partir de lg ; en dessous, un bloc par article. -->
        <div class="hidden overflow-hidden rounded-lg border border-trait lg:block">
          <table class="w-full text-left text-sm">
            <thead class="bg-tuile-claire text-xs text-texte-attenue">
              <tr>
                <th scope="col" class="px-3 py-2.5 font-semibold">Produit</th>
                <th scope="col" class="px-3 py-2.5 font-semibold">Options</th>
                <th scope="col" class="px-3 py-2.5 font-semibold">Qté</th>
                <th scope="col" class="px-3 py-2.5 font-semibold">Prix unitaire</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <ul class="flex flex-col overflow-hidden rounded-lg border border-trait lg:hidden">
          <slot name="articles"></slot>
        </ul>

        <p class="flex justify-between text-base font-bold lg:text-sm">
          <span>Total TTC</span>
          <span>{{total}}</span>
        </p>
      </section>

      <section class="flex flex-col gap-3.5 rounded-xl border border-trait bg-page p-3.5 lg:gap-4 lg:p-6">
        <h2 class="text-prix-sm font-bold">Journal des modifications</h2>
        <ol class="flex flex-col gap-2.5 text-sm">
          <slot name="journal"></slot>
        </ol>
      </section>
    </div>

    <section class="flex flex-col gap-3.5 rounded-xl border border-trait bg-page p-3.5 lg:col-start-2 lg:row-start-1 lg:gap-4 lg:p-6">
      <h2 class="text-prix-sm font-bold">Client</h2>
      <dl class="flex flex-col gap-2.5 text-sm">
        <div class="flex flex-wrap justify-between gap-x-4">
          <dt class="text-texte-attenue">Nom</dt>
          <dd class="font-medium">{{client}}</dd>
        </div>
        <div class="flex flex-wrap justify-between gap-x-4">
          <dt class="text-texte-attenue">E-mail</dt>
          <dd class="font-medium break-all">{{email}}</dd>
        </div>
      </dl>
    </section>
  </div>
</div>
