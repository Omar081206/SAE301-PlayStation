<div class="grid gap-6 lg:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] lg:gap-8">
  <section class="flex flex-col gap-3.5 rounded-xl bg-page p-5.25 shadow-panneau-sm lg:gap-4 lg:rounded-2xl lg:p-6">
    <div class="flex flex-wrap items-center justify-between gap-3.5">
      <h2 class="text-prix-sm font-light lg:text-prix-lg">Commande {{numero}}</h2>
      <slot name="statut"></slot>
    </div>

    <dl class="grid grid-cols-[auto_1fr] gap-x-5 gap-y-1.75 text-sm">
      <dt class="text-texte-attenue">Passée le</dt>
      <dd>{{date}}</dd>
      <dt class="text-texte-attenue">Client</dt>
      <dd>{{pseudo}} · {{email}}</dd>
    </dl>

    <hr class="border-trait">

    <ul class="flex flex-col gap-3">
      <slot name="lignes"></slot>
    </ul>

    <p class="flex justify-between font-bold leading-6">
      <span>Total TTC</span>
      <span>{{total}}</span>
    </p>

    <hr class="border-trait">

    <div data-role="actions" class="flex flex-wrap gap-3.5">
      <slot name="boutons"></slot>
    </div>
    <p data-role="finale" class="text-sm text-texte-attenue">Cette commande ne peut plus changer de statut.</p>
  </section>

  <section class="flex flex-col gap-3.5 self-start rounded-xl bg-page p-5.25 shadow-panneau-sm lg:gap-4 lg:rounded-2xl lg:p-6">
    <h2 class="text-lg font-bold">Historique</h2>
    <ol class="flex flex-col gap-3 text-sm">
      <slot name="historique"></slot>
    </ol>
  </section>
</div>
