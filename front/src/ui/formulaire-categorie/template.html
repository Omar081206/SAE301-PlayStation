<section class="flex flex-col gap-3.5 rounded-xl border border-trait bg-page p-5.25 lg:gap-4 lg:p-4.5">
  <h2 data-focus tabindex="-1" class="text-prix-sm font-bold">{{titre}}</h2>

  <slot name="message"></slot>

  <form class="flex flex-col gap-3.5 lg:gap-4">
    <label class="flex flex-col gap-2 text-sm">
      Nom
      <input name="nom" type="text" required minlength="2" maxlength="60" value="{{nom}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <label class="flex flex-col gap-2 text-sm">
      Description
      <input name="description" type="text" required maxlength="500" value="{{description}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <button type="submit" class="anneau-action rounded-full bg-action px-4 py-3 text-sm leading-3.5 font-bold text-texte-inverse enabled:hover:bg-action-survol">{{bouton}}</button>
    <button type="button" data-action="annuler" class="anneau-lien rounded-full bg-secondaire px-4 py-3 text-sm leading-3.5 font-bold text-lien enabled:hover:bg-secondaire-survol">Annuler la modification</button>
  </form>
</section>
