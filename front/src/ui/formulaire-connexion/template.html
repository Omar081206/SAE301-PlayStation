<section class="flex w-full max-w-110 flex-col gap-4 rounded-xl border border-trait bg-page p-6">
  <img src="{{logo}}" alt="PlayStation" width="44" height="34" class="h-8.5 w-auto self-start">
  <h1 class="text-prix-lg font-bold">Back-office</h1>

  <slot name="message"></slot>

  <form class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-sm">
      Adresse e-mail de l’administrateur
      <input name="email" type="email" required maxlength="180" autocomplete="username" value="{{email}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <label class="flex flex-col gap-2 text-sm">
      Mot de passe
      <input name="mdp" type="password" required autocomplete="current-password" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <button type="submit" class="rounded-full bg-action px-4 py-3 text-sm leading-3.5 font-bold text-texte-inverse enabled:hover:bg-action-survol">Se connecter</button>
  </form>
</section>
