<section class="flex max-w-130 flex-col gap-3.5 rounded-xl bg-page p-7 shadow-panneau-sm lg:gap-4 lg:rounded-2xl lg:p-8">
  <h2 class="text-prix-sm font-light lg:text-prix-lg">Connexion administrateur</h2>

  <form class="flex flex-col gap-3.5 lg:gap-4">
    <label class="flex flex-col gap-1.75 text-sm lg:gap-2">
      Identifiant ou adresse e-mail
      <input name="identifiant" type="text" required maxlength="180" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{identifiant}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <label class="flex flex-col gap-1.75 text-sm lg:gap-2">
      Mot de passe
      <input name="mdp" type="password" required autocomplete="current-password" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <button type="submit" class="rounded-full bg-action px-4 py-3 text-sm leading-3.5 font-bold text-texte-inverse">Se connecter</button>
  </form>
</section>
