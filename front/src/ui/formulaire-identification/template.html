<section class="flex flex-col gap-3.5 rounded-xl p-7 shadow-panneau-sm md:shadow-panneau lg:gap-4 lg:rounded-2xl lg:p-8">
  <h2 class="text-prix-sm font-light md:text-prix-md lg:text-prix-lg">{{titre}}</h2>

  <slot name="message"></slot>

  <!-- Les champs sont enveloppés par leur label : pas d'id, le template est
       instancié deux fois sur la page. -->
  <form class="flex flex-col gap-3.5 lg:gap-4">
    <!-- Inscription seulement : retiré en JS pour la connexion. -->
    <div data-role="identite" class="grid gap-3.5 md:grid-cols-2 lg:gap-4">
      <label class="flex flex-col gap-1.75 text-sm lg:gap-2">
        Prénom
        <input name="prenom" type="text" required maxlength="60" autocomplete="given-name" value="{{prenom}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
      </label>

      <label class="flex flex-col gap-1.75 text-sm lg:gap-2">
        Nom
        <input name="nom" type="text" required maxlength="60" autocomplete="family-name" value="{{nom}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
      </label>
    </div>

    <label class="flex flex-col gap-1.75 text-sm lg:gap-2">
      Adresse e-mail
      <input name="email" type="email" required maxlength="180" autocomplete="email" value="{{email}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <label class="flex flex-col gap-1.75 text-sm lg:gap-2">
      Mot de passe
      <input name="mdp" type="password" required autocomplete="{{autocomplete}}" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
    </label>

    <button type="submit" class="rounded-full px-4 py-3 text-sm leading-3.5 font-bold {{couleurs}}">{{bouton}}</button>
  </form>
</section>
