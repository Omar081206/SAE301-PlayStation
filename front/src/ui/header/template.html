<header class="border-b border-trait bg-page">
  <div class="flex h-9 items-center justify-end bg-barre-sony pr-3.5 md:pr-7 lg:pr-20">
    <img src="{{logoSony}}" alt="Sony" width="62" height="11">
  </div>

  <div class="flex h-15 items-center justify-between px-3.5 md:px-7 lg:h-16 lg:px-20">
    <a href="/" data-link aria-label="PlayStation Click &amp; Collect, accueil">
      <img src="{{logoPlayStation}}" alt="" width="41" height="32">
    </a>

    <a href="/panier" data-link aria-label="{{libellePanier}}" class="relative block size-10">
      <img src="{{iconePanier}}" alt="" width="24" height="24" class="absolute top-2 left-2">
      <span data-role="compteur" class="absolute top-0 left-6 flex h-4.5 min-w-4.5 items-center justify-center rounded-full bg-achat px-1 text-xs font-bold text-texte-inverse">{{nombre}}</span>
    </a>
  </div>
</header>
