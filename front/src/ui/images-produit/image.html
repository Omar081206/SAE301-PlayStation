<li class="flex flex-col items-center gap-1 text-xs">
  <img src="{{src}}" alt="{{alt}}" width="76" height="76" class="size-19 rounded-md bg-tuile object-contain">
  <span data-role="principale" class="font-medium">Principale</span>
  <button type="button" data-action="principale" aria-label="Faire de l’image {{alt}} l’image principale" class="text-texte-attenue underline">Principale ?</button>
  <button type="button" data-action="supprimer" aria-label="Supprimer l’image {{alt}}" class="font-medium text-texte-attenue">Supprimer</button>
  <label data-role="variante" class="w-full">
    <span class="sr-only">Variante de l’image {{alt}}</span>
    <select class="w-full rounded-md border border-trait bg-page px-1 py-1 text-xs">
      <option value="">Toutes</option>
    </select>
  </label>
</li>
