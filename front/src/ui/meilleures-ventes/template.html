<section class="flex flex-col gap-3.5 rounded-xl border border-trait bg-page p-3.5 lg:p-6">
  <h2 class="text-prix-sm font-bold">Produits les plus vendus</h2>
  <div class="overflow-hidden rounded-xl border border-trait">
    <!-- Tableau à partir de md, liste en dessous. Les lignes du tableau sont
         ajoutées en JS dans le <tbody> : un <slot> n'y est pas permis. -->
    <table class="hidden w-full text-left text-sm md:table">
      <thead class="bg-tuile-claire text-xs text-texte-attenue">
        <tr>
          <th scope="col" class="w-65 px-4 py-3 font-semibold">Produit</th>
          <th scope="col" class="px-4 py-3 font-semibold">Ventes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <ul class="flex flex-col md:hidden">
      <slot name="elements"></slot>
    </ul>
  </div>
</section>
