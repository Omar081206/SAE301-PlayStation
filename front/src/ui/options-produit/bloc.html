<li class="flex flex-col gap-2 border-t border-trait p-2.5 text-sm first:border-t-0">
  <p>{{libelle}}</p>
  <label class="flex items-center justify-between gap-3 text-xs font-semibold">
    Supplément (€)
    <input data-champ="supplement" type="number" step="0.01" value="{{supplement}}" class="w-24 rounded-md border border-trait bg-page px-3 py-2 text-sm font-normal">
  </label>
  <label class="flex items-center justify-between gap-3 text-xs font-semibold">
    Stock
    <input data-champ="stock" type="number" min="0" max="65535" step="1" value="{{stock}}" class="w-24 rounded-md border border-trait bg-page px-3 py-2 text-sm font-normal">
  </label>
</li>
