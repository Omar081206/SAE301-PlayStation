<li class="flex flex-col gap-3 rounded-lg border-2 border-action px-4 py-3 text-sm">
  <label class="flex flex-col gap-2">
    Nom de l’option
    <input data-focus="nom" name="nom-option" type="text" maxlength="40" value="{{nom}}" placeholder="Coloris, Édition…" class="rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
  </label>

  <fieldset class="flex flex-col gap-2">
    <legend class="mb-2">Valeurs</legend>
    <ul class="flex flex-col gap-2">
      <slot name="valeurs"></slot>
    </ul>
    <div class="flex gap-2">
      <label class="flex-1">
        <span class="sr-only">Nouvelle valeur</span>
        <input data-role="nouvelle" data-focus="nouvelle" type="text" maxlength="60" placeholder="Nouvelle valeur" class="w-full rounded-lg border border-champ bg-page px-3 py-2 text-base leading-6">
      </label>
      <button type="button" data-action="ajouter-valeur" class="rounded-full bg-secondaire px-4 py-2 font-bold text-lien">Ajouter</button>
    </div>
  </fieldset>

  <div class="flex flex-wrap gap-3">
    <button type="button" data-action="terminer" class="rounded-full bg-action px-4 py-2 font-bold text-texte-inverse">Terminer</button>
    <button type="button" data-action="retirer-option" class="font-medium underline">Retirer l’option</button>
  </div>
</li>
