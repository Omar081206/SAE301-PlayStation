<tr class="border-t border-trait">
  <td class="px-4 py-2.5">{{libelle}}</td>
  <td class="px-4 py-2.5"><input data-champ="supplement" type="number" step="0.01" value="{{supplement}}" aria-label="Supplément de {{libelle}}" class="w-24 rounded-md border border-trait bg-page px-3 py-2 text-sm"></td>
  <td class="px-4 py-2.5"><input data-champ="stock" type="number" min="0" max="65535" step="1" value="{{stock}}" aria-label="Stock de {{libelle}}" class="w-24 rounded-md border border-trait bg-page px-3 py-2 text-sm"></td>
</tr>
