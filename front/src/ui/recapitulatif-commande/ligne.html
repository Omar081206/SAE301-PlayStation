<li class="flex items-start gap-3.5 lg:gap-4">
  <img src="{{image}}" alt="{{alt}}" width="72" height="72" class="size-14 shrink-0 rounded-md bg-tuile-claire object-contain lg:size-18 lg:rounded-lg">
  <div class="flex min-w-0 flex-1 flex-col gap-1 text-sm">
    <p class="font-bold lg:text-base">{{nom}}</p>
    <p data-role="options" class="text-texte-attenue">{{options}}</p>
    <p class="text-texte-attenue">Qté {{quantite}}</p>
  </div>
  <!-- Produit en promotion : le montant d'origine barré au-dessus (data-role « initial », retiré sinon). -->
  <div class="shrink-0 text-right">
    <s data-role="initial" class="block text-xs font-normal text-texte-barre lg:text-sm"><span class="sr-only">Prix d’origine : </span>{{sousTotalInitial}}</s>
    <p class="font-bold">{{sousTotal}}</p>
  </div>
</li>
