<div class="grid gap-5.25 lg:grid-cols-[1fr_27.5rem] lg:gap-12">
  <section class="flex flex-col gap-3.5 rounded-xl p-7 shadow-panneau-sm md:shadow-panneau lg:gap-4 lg:self-start lg:rounded-2xl lg:p-8">
    <h2 class="text-prix-sm font-light md:text-prix-md lg:text-prix-lg">Articles ({{nombre}})</h2>
    <ul class="flex flex-col gap-3.5 lg:gap-4">
      <slot name="lignes"></slot>
    </ul>
  </section>

  <section class="flex flex-col gap-3.5 rounded-xl p-7 shadow-panneau-sm md:shadow-panneau lg:gap-4 lg:self-start lg:rounded-2xl lg:p-8" aria-label="Total de la commande">
    <slot name="code"></slot>
    <slot name="reduction"></slot>
    <p class="flex justify-between font-bold">
      <span>Total TTC</span>
      <span>{{total}}</span>
    </p>
    <button type="button" data-action="confirmer" class="rounded-full bg-achat px-4 py-3 text-sm leading-3.5 font-bold text-texte-inverse disabled:opacity-60 enabled:hover:bg-achat-survol">Confirmer ma commande</button>
  </section>
</div>
