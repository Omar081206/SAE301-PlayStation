<li class="flex flex-col gap-3.5 rounded-xl bg-page p-5.25 shadow-panneau-sm md:flex-row md:items-start md:justify-between lg:rounded-2xl lg:p-6">
  <div class="flex min-w-0 flex-col gap-1.75">
    <h2 class="text-lg font-bold">{{nom}}</h2>
    <p class="text-sm text-texte-attenue">/categorie/{{slug}} · {{produits}}</p>
    <p class="text-sm">{{description}}</p>
  </div>

  <div class="flex shrink-0 gap-3.5">
    <button type="button" data-action="modifier" aria-label="Modifier {{nom}}" class="rounded-full bg-secondaire px-4 py-3 text-sm leading-3.5 font-bold text-lien">Modifier</button>
    <button type="button" data-action="supprimer" aria-label="Supprimer {{nom}}" class="rounded-full bg-secondaire px-4 py-3 text-sm leading-3.5 font-bold text-red-700">Supprimer</button>
  </div>
</li>
