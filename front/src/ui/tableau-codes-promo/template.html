       ajoutées en JS dans le <tbody> : un <slot> n'y est pas permis. -->

    <thead class="bg-tuile-claire text-xs text-texte-attenue">
      <tr>
        <th scope="col" class="px-4 py-3 font-semibold">Code</th>
        <th scope="col" class="px-4 py-3 font-semibold">Réduction</th>
        <th scope="col" class="px-4 py-3 font-semibold">Utilisations</th>
        <th scope="col" class="px-4 py-3 font-semibold">Remise totale</th>
        <th scope="col" class="px-4 py-3 font-semibold">Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <ul class="flex flex-col md:hidden">
    <slot name="elements"></slot>
  </ul>
</section>
