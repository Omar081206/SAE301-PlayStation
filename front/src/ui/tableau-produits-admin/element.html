<li class="flex flex-col gap-1.5 border-t border-trait px-3.5 py-3 text-sm first:border-t-0">
  <p class="font-semibold">{{nom}}</p>
  <dl class="grid grid-cols-[1fr_auto] gap-x-4 gap-y-1">
    <dt class="text-xs font-semibold">Prix de base</dt><dd class="text-right">{{prix}}</dd>
    <dt class="text-xs font-semibold">Stock</dt><dd class="text-right">{{stock}}</dd>
  </dl>
  <slot name="actions"></slot>
</li>
