<section aria-label="Produits du catalogue" class="overflow-hidden rounded-xl border border-trait bg-page">
  <!-- Tableau à partir de lg, liste en dessous. Les lignes du tableau sont
       ajoutées en JS dans le <tbody> : un <slot> n'y est pas permis. -->
  <table class="hidden w-full text-left text-sm lg:table">
    <thead class="bg-tuile-claire text-xs text-texte-attenue">
      <tr>
        <th scope="col" class="px-4 py-3 font-semibold">Nom</th>
        <th scope="col" class="px-4 py-3 font-semibold">Prix de base</th>
        <th scope="col" class="px-4 py-3 font-semibold">Stock</th>
        <th scope="col" class="px-4 py-3 font-semibold">Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <ul class="flex flex-col lg:hidden">
    <slot name="elements"></slot>
  </ul>
</section>
